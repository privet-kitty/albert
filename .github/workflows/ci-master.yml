name: CI (master)

on:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup NodeJs
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install Dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Run test
        run: npm test
  deploy-docs:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup NodeJs
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install Dependencies
        run: npm ci
      - name: Export
        run: npm run build-prod
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
