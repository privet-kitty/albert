name: CI (develop)

on:
  push:
    branches-ignore:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup NodeJs
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install Dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Run test
        run: npm test
